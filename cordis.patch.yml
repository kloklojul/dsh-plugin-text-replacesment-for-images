- insert:
    - id: image-to-text
      name: dsh-image-to-text
      config:
        defaultEnabled: false
        routes: {}
        # Omit provider/model to use the current agent's selected model.
        maxOutputTokens: 8192
        retryMaxOutputTokens: 32768
        failureMode: passthrough
        timeoutMs: 180000
        maxFocusChars: 12000
